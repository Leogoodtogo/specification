<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
<script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';

    const urlParams = new URLSearchParams(window.location.search);
    let pdfFileName = urlParams.get('file');

    if (!pdfFileName) {
        document.getElementById('canvas-container').innerHTML = '<p style="color:white;">错误：未指定 PDF 文件名。</p>';
    } else {
        // 关键修正：只取文件名，去掉任何路径或域名前缀
        pdfFileName = pdfFileName.split('/').pop();

        // 拼接为当前域名下的绝对路径，避免相对路径解析歧义
        const pdfUrl = window.location.origin + '/' + encodeURIComponent(pdfFileName);

        pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
            const container = document.getElementById('canvas-container');
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                pdf.getPage(pageNum).then(function(page) {
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    container.appendChild(canvas);
                    const renderContext = {
                        canvasContext: canvas.getContext('2d'),
                        viewport: viewport
                    };
                    page.render(renderContext);
                });
            }
        }).catch(function(error) {
            document.getElementById('canvas-container').innerHTML = '<p style="color:white;">加载 PDF 失败：' + error.message + '</p>';
        });
    }
</script>
