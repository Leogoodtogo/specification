name: Convert PDF to Images

on:
  push:
    paths:
      - 'pdfs/**.pdf'

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Convert PDFs to images
        run: |
          mkdir -p images
          for pdf in pdfs/*.pdf; do
            if [ -f "$pdf" ]; then
              basename=$(basename "$pdf" .pdf)
              rm -rf "images/$basename"
              mkdir -p "images/$basename"
              # 先转到临时目录（文件名由 pdftoppm 默认生成，可能带前导零）
              tmpdir=$(mktemp -d)
              pdftoppm -jpeg -r 150 "$pdf" "$tmpdir/page"
              # 重命名为不带前导零：page-1.jpg, page-2.jpg ...
              i=1
              for f in $(ls "$tmpdir"/page-*.jpg | sort -V); do
                mv "$f" "images/$basename/page-$i.jpg"
                i=$((i + 1))
              done
              rm -rf "$tmpdir"
              echo "Converted: $pdf ($((i - 1)) pages)"
            fi
          done

      - name: Commit and push images
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add images/
          git commit -m "Convert PDFs to images" || echo "No changes to commit"
          git push
