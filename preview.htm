<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <style>
        body { margin: 0; padding: 0; background-color: #333; }
        #canvas-container { text-align: center; padding: 10px; }
        img { max-width: 100%; height: auto; box-shadow: 0 0 10px rgba(0,0,0,0.5); margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
   <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pdfName = urlParams.get('file');

    if (!pdfName) {
        document.getElementById('canvas-container').innerHTML =
            '<p style="color:red;">Error: file parameter is empty.</p>';
    } else {
        const baseName = pdfName.replace(/\.pdf$/i, '');
        const container = document.getElementById('canvas-container');
        const maxPages = 200;

        // 占位符：先给每页一个灰色方块，滚到附近再加载真实图片
        const observers = [];
        for (let n = 1; n <= maxPages; n++) {
            const wrapper = document.createElement('div');
            wrapper.style.minHeight = '800px'; // 占位高度，避免滚动跳变
            wrapper.style.marginBottom = '10px';
            wrapper.style.background = '#222';
            container.appendChild(wrapper);

            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        const img = new Image();
                        img.src = '/images/' + baseName + '/page-' + n + '.jpg';
                        img.style.maxWidth = '100%';
                        img.style.height = 'auto';
                        img.style.display = 'block';
                        img.style.margin = '0 auto';
                        wrapper.style.minHeight = ''; // 图片加载后取消占位高度
                        img.onload = function() {
                            wrapper.appendChild(img);
                        };
                        observer.disconnect();
                    }
                });
            }, { rootMargin: '200px' }); // 提前 200px 开始加载
            observer.observe(wrapper);
            observers.push(observer);
        }
    }
</script>
</body>
</html>
